services:
  web:
    build: .
    ports:
      - "${PORT:-8000}:8000"
    environment:
      ARCHIVE_DB: /app/data/archive.sqlite3
      # Set SECRET_KEY in your shell or a .env file for production.  If it is
      # omitted the app generates one and persists it in the data volume.
      SECRET_KEY: ${SECRET_KEY:-}
    volumes:
      - archive-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/').status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  archive-data:
